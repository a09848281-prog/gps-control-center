<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>位置情報の確認</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#fff;color:#111;font:16px/1.8 system-ui,-apple-system,sans-serif}#message{white-space:pre-wrap;margin:0 0 16px}p{margin:0 0 15px}a{color:#111}#state{margin-top:18px}#retry{display:none;margin-top:14px}
</style>
</head>
<body>
<p id="message">リンク情報を確認しています。</p>
<p id="disclosure" hidden>ブラウザで位置情報を許可した場合に限り、緯度・経度・精度が管理者のスプレッドシートに保存されます。保存後、設定されたサイトへ移動します。</p>
<p id="state" role="status" aria-live="polite">読み込み中です。</p>
<p id="retry"><a href="#" id="retryLink">位置情報の取得を再試行</a></p>
<script>
(function(){
  'use strict';
  const GAS_URL='https://script.google.com/macros/s/AKfycbwpXU2o4U5k7BUV6RK4-8IWeeNIwTL5uQoNcxleHmkiFiWFmX8UAnBLDLNiry8M4Ka4ig/exec';
  const params=new URLSearchParams(location.search);
  const slug=params.get('slug')||'';
  const message=document.getElementById('message');
  const state=document.getElementById('state');
  const retry=document.getElementById('retry');
  const disclosure=document.getElementById('disclosure');
  let linkData=null;
  let busy=false;
  function showError(text){state.textContent=text;retry.style.display='block';}
  function loadPublicLink(){
    if(!slug){showError('URLに識別文字がありません。');return;}
    if(GAS_URL.indexOf('PASTE_')===0){showError('管理システムの接続設定がまだ完了していません。');return;}
    const callback='gpsPublic_'+Math.random().toString(36).slice(2);
    window[callback]=function(data){try{delete window[callback];}catch(e){}if(!data||!data.ok){showError(data&&data.error?data.error:'このURLは利用できません。');return;}linkData=data;message.textContent=data.message;disclosure.hidden=false;startLocation();};
    const script=document.createElement('script');
    script.referrerPolicy='no-referrer';
    script.onerror=function(){showError('URL情報を取得できません。時間をおいて再度お試しください。');};
    script.src=GAS_URL+'?action=publicLink&slug='+encodeURIComponent(slug)+'&prefix='+encodeURIComponent(callback);
    document.head.appendChild(script);
  }
  function verifySave(requestId,attempt){
    const callback='gpsVerify_'+Math.random().toString(36).slice(2);
    window[callback]=function(result){try{delete window[callback];}catch(e){}if(result&&result.ok){state.textContent='位置情報を保存しました。指定されたページへ移動します。';const delay=Math.max(0,Math.min(30,Number(linkData.delaySeconds)||0));window.setTimeout(function(){location.replace(linkData.destinationUrl);},delay*1000);}else if(result&&result.pending&&attempt<8){window.setTimeout(function(){verifySave(requestId,attempt+1);},500);}else{showError(result&&result.error?result.error:'位置情報を保存できませんでした。移動は行っていません。');}};
    const script=document.createElement('script');script.referrerPolicy='no-referrer';script.onerror=function(){if(attempt<8)setTimeout(()=>verifySave(requestId,attempt+1),500);else showError('保存結果を確認できませんでした。移動は行っていません。');};
    script.src=GAS_URL+'?action=verifySave&requestId='+encodeURIComponent(requestId)+'&prefix='+encodeURIComponent(callback);
    document.head.appendChild(script);
  }
  async function saveLocation(position){
    const requestId=(crypto&&crypto.randomUUID)?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}));
    const fields=new URLSearchParams({mode:'recordLocation',slug:slug,nonce:linkData.nonce,requestId:requestId,latitude:String(position.coords.latitude),longitude:String(position.coords.longitude),accuracy:String(position.coords.accuracy)});
    state.textContent='位置情報を安全に送信しています。';
    try{
      await fetch(GAS_URL,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:fields.toString()});
      verifySave(requestId,0);
    }catch(error){showError('位置情報を保存できませんでした。通信状態を確認してください。');}
  }
  function geoError(error){busy=false;let text='位置情報を取得できませんでした。位置情報は送信されていません。';if(error&&error.code===1)text='位置情報が許可されませんでした。位置情報は送信されていません。';if(error&&error.code===3)text='位置情報の取得がタイムアウトしました。位置情報は送信されていません。';showError(text);}
  function startLocation(){
    if(busy||!linkData)return;
    if(!navigator.geolocation){showError('このブラウザは位置情報に対応していません。');return;}
    busy=true;retry.style.display='none';state.textContent='ブラウザの位置情報許可を確認しています。';
    navigator.geolocation.getCurrentPosition(saveLocation,geoError,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  }
  document.getElementById('retryLink').addEventListener('click',function(event){event.preventDefault();startLocation();});
  loadPublicLink();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URL管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:22px;max-width:920px;background:#fff;color:#111;font:16px/1.7 system-ui,-apple-system,sans-serif}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:28px 0 10px}p{margin:8px 0}label{display:block;font-weight:600;margin:13px 0 5px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #888;border-radius:2px;background:#fff;color:#111}textarea{min-height:78px;resize:vertical}button{padding:9px 14px;border:1px solid #111;background:#fff;color:#111;cursor:pointer}button.primary{background:#111;color:#fff}button.danger{border-color:#900;color:#900}.hidden{display:none!important}.muted{color:#555;font-size:13px}.status{white-space:pre-wrap;padding:10px 0;border-block:1px solid #ddd;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}hr{border:0;border-top:1px solid #ddd;margin:22px 0}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #ddd;padding:8px 5px;font-size:14px;overflow-wrap:anywhere}a{color:#111}.copy{margin:3px 4px 3px 0}@media(max-width:620px){body{padding:15px}table{display:block;overflow-x:auto;white-space:nowrap}.row{align-items:flex-start}}
  </style>
</head>
<body>
<h1>URL管理</h1>
<p>発行URL、表示文章、転送先、有効期限、取得された位置情報を管理します。</p>
<div id="state" class="status" role="status" aria-live="polite">確認しています…</div>
<section id="setup" class="hidden">
  <h2>初回設定</h2>
  <p class="muted">Apps Scriptの「プロジェクトの設定」→「スクリプト プロパティ」に登録した SETUP_KEY を入力してください。</p>
  <label for="setupKey">セットアップキー</label><input id="setupKey" type="password" autocomplete="off">
  <label for="newPassword">管理者パスワード（10文字以上）</label><input id="newPassword" type="password" autocomplete="new-password">
  <p><button id="setupButton" class="primary">管理者パスワードを設定</button></p>
</section>
<section id="login" class="hidden">
  <h2>管理者ログイン</h2>
  <label for="password">管理者パスワード</label><input id="password" type="password" autocomplete="current-password">
  <p><button id="loginButton" class="primary">ログイン</button></p>
</section>
<main id="dashboard" class="hidden">
  <hr><div class="row"><h2 style="margin:0">URLを発行</h2><button id="logoutButton">ログアウト</button></div>
  <label for="slug">URLに入れる好きな文字</label><input id="slug" maxlength="50" placeholder="例：my-link / お知らせ">
  <p class="muted">日本語・英数字・ハイフン・アンダーバーが使えます。空白とスラッシュは使えません。</p>
  <label for="message">相手の画面に表示する文章</label><textarea id="message" maxlength="200">位置情報を取得します。内容を確認し、ブラウザの位置情報許可を選択してください。</textarea>
  <label for="destination">リダイレクト先URL（HTTPS）</label><input id="destination" type="url" placeholder="https://example.com/">
  <label for="expiresAt">有効期限（空欄なら期限なし）</label><input id="expiresAt" type="datetime-local">
  <label for="delaySeconds">取得後の待ち時間（秒・0〜30）</label><input id="delaySeconds" type="number" min="0" max="30" step="1" value="0">
  <p><button id="createButton" class="primary">専用URLを発行</button></p>
  <div id="appStatus" class="status" role="status" aria-live="polite"></div>
  <h2>発行済みURL</h2><p><button id="refreshLinks">一覧を更新</button></p>
  <table><thead><tr><th>識別文字・共有URL</th><th>状態</th><th>期限</th><th>操作</th></tr></thead><tbody id="linksBody"><tr><td colspan="4">未取得</td></tr></tbody></table>
  <h2>取得された位置情報</h2><p class="muted">相手が説明を確認し、ブラウザで許可した場合だけ記録されます。</p><p><button id="refreshLocations">履歴を更新</button></p>
  <table><thead><tr><th>取得日時</th><th>識別文字</th><th>緯度</th><th>経度</th><th>精度</th><th>地図</th></tr></thead><tbody id="locationsBody"><tr><td colspan="6">未取得</td></tr></tbody></table>
</main>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  let token='';
  function status(message){$('state').textContent=message;$('appStatus').textContent=message;}
  function run(name,args,onSuccess){
    const runner=google.script.run.withSuccessHandler(onSuccess||function(){}).withFailureHandler(error=>status(error&&error.message?error.message:'通信エラー'));
    runner[name].apply(runner,args||[]);
  }
  function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function formatDate(value){if(!value)return'期限なし';const date=new Date(value);return isNaN(date.getTime())?'':date.toLocaleString('ja-JP');}
  function showDashboard(){ $('setup').classList.add('hidden');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadLinks();loadLocations(); }
  function checkState(){run('getAdminState',[],info=>{if(info.setupRequired){$('setup').classList.remove('hidden');$('login').classList.add('hidden');$('dashboard').classList.add('hidden');status('最初に管理者パスワードを設定してください。');}else{$('login').classList.remove('hidden');$('setup').classList.add('hidden');$('dashboard').classList.add('hidden');status('管理者パスワードを入力してください。');}});}
  $('setupButton').addEventListener('click',()=>{const key=$('setupKey').value,password=$('newPassword').value;if(password.length<10){status('パスワードは10文字以上にしてください。');return;}run('setupAdmin',[key,password],()=>{ $('setupKey').value='';$('newPassword').value='';status('設定しました。続けてログインしてください。');checkState();});});
  $('loginButton').addEventListener('click',()=>{run('adminLogin',[$('password').value],result=>{token=result.token;$('password').value='';showDashboard();status('ログインしました。');});});
  $('logoutButton').addEventListener('click',()=>{token='';$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');status('ログアウトしました。');});
  function loadLinks(){if(!token)return;run('adminListLinks',[token],result=>{const body=$('linksBody');body.textContent='';if(!result.links.length){body.innerHTML='<tr><td colspan="4">発行済みURLはありません。</td></tr>';return;}result.links.forEach(link=>{const tr=document.createElement('tr');tr.innerHTML='<td><b>'+escapeHtml(link.slug)+'</b><br><a target="_blank" rel="noopener" href="'+escapeHtml(link.url)+'">'+escapeHtml(link.url)+'</a></td><td>'+(link.active?'有効':'無効')+'</td><td>'+escapeHtml(formatDate(link.expiresAt))+'</td><td></td>';const cell=tr.lastElementChild;const copy=document.createElement('button');copy.textContent='コピー';copy.className='copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(link.url).then(()=>status('共有URLをコピーしました。')).catch(()=>window.prompt('URLをコピーしてください',link.url)));cell.appendChild(copy);if(link.active){const disable=document.createElement('button');disable.textContent='無効化';disable.className='danger';disable.addEventListener('click',()=>{if(confirm('このURLを無効化しますか？'))run('adminDeactivateLink',[link.id,token],()=>{status('URLを無効化しました。');loadLinks();});});cell.appendChild(disable);}body.appendChild(tr);});});}
  function loadLocations(){if(!token)return;run('adminListLocations',[token],result=>{const body=$('locationsBody');body.textContent='';if(!result.locations.length){body.innerHTML='<tr><td colspan="6">位置情報の記録はありません。</td></tr>';return;}result.locations.forEach(item=>{const map='https://www.openstreetmap.org/?mlat='+encodeURIComponent(item.latitude)+'&mlon='+encodeURIComponent(item.longitude)+'#map=17/'+item.latitude+'/'+item.longitude;const tr=document.createElement('tr');tr.innerHTML='<td>'+escapeHtml(formatDate(item.capturedAt))+'</td><td>'+escapeHtml(item.slug)+'</td><td>'+Number(item.latitude).toFixed(6)+'</td><td>'+Number(item.longitude).toFixed(6)+'</td><td>'+Math.round(Number(item.accuracy))+' m</td><td><a target="_blank" rel="noopener" href="'+escapeHtml(map)+'">地図</a></td>';body.appendChild(tr);});});}
  $('createButton').addEventListener('click',()=>{const slug=$('slug').value.trim(),message=$('message').value.trim(),destinationUrl=$('destination').value.trim(),raw=$('expiresAt').value;let expiresAt='';try{const url=new URL(destinationUrl);if(url.protocol!=='https:')throw new Error();}catch(e){status('リダイレクト先はHTTPS URLにしてください。');return;}if(raw){const date=new Date(raw);if(isNaN(date.getTime())||date.getTime()<=Date.now()){status('有効期限は未来の日時にしてください。');return;}expiresAt=date.toISOString();}const delay=Number($('delaySeconds').value||0);if(!Number.isInteger(delay)||delay<0||delay>30){status('待ち時間は0〜30秒にしてください。');return;}$('createButton').disabled=true;run('adminCreateLink',[{slug:slug,message:message,destinationUrl:destinationUrl,expiresAt:expiresAt,delaySeconds:delay},token],result=>{$('createButton').disabled=false;$('slug').value='';status('URLを発行しました。\n'+result.url);navigator.clipboard.writeText(result.url).catch(()=>{});loadLinks();});});
  $('refreshLinks').addEventListener('click',loadLinks);$('refreshLocations').addEventListener('click',loadLocations);
  checkState();
})();
</script>
</body></html>
